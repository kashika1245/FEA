[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-a-scientific"
version = "0.3.0"
description = "Paper A: scientific engine plus Phase 3 research API and job infrastructure"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — research artefact" }
authors = [{ name = "Paper A research software" }]
dependencies = [
    "numpy>=2.1",
    "pydantic>=2.10",
    "pyarrow>=18.0",
    "pyyaml>=6.0",
    "torch>=2.5",
    "matplotlib>=3.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.122",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = [
    "error",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"backend/app/api/app.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
packages = ["app"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "torch", "torch.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["backend/app"]
branch = true
omit = ["backend/app/__init__.py"]

[tool.coverage.report]
fail_under = 0
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
